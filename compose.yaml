name: real-estate-intelligence

services:
  # The image ships PostGIS and pgvector, but no extension is enabled by
  # default: a migration that needs one runs its own CREATE EXTENSION.
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realestate}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      # PostgreSQL 18 expects a single mount at /var/lib/postgresql and
      # places the cluster in a version-specific subdirectory; mounting
      # /var/lib/postgresql/data makes the image refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-realestate} -d ${POSTGRES_DB:-real_estate_intelligence}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-realestate}@postgres:5432/${POSTGRES_DB:-real_estate_intelligence}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-realestate}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-realestate}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-real-estate-intelligence}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-realestate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-realestate}
    ports:
      - '${MINIO_API_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_PORT:-9101}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 8200
      DATABASE_URL: postgres://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-realestate}@postgres:5432/${POSTGRES_DB:-real_estate_intelligence}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: real-estate-intelligence-api
    ports:
      - '${API_PORT:-8200}:8200'
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8200/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-realestate}@postgres:5432/${POSTGRES_DB:-real_estate_intelligence}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-realestate}:${RABBITMQ_PASSWORD:-realestate}@rabbitmq:5672/${RABBITMQ_VHOST:-real-estate-intelligence}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-30000}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-1000}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-25}
      OUTBOX_CLAIM_LEASE_MS: ${OUTBOX_CLAIM_LEASE_MS:-130000}
      RABBITMQ_RECONNECT_INTERVAL_MS: ${RABBITMQ_RECONNECT_INTERVAL_MS:-1000}
      WORKER_OPERATION_TIMEOUT_MS: ${WORKER_OPERATION_TIMEOUT_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
      EVENT_DELIVERY_LIMIT: ${EVENT_DELIVERY_LIMIT:-5}
      EVENT_REDELIVERY_DELAY_MS: ${EVENT_REDELIVERY_DELAY_MS:-1000}
      OUTBOX_RETENTION_MS: ${OUTBOX_RETENTION_MS:-604800000}
      INBOX_RETENTION_MS: ${INBOX_RETENTION_MS:-2592000000}
      DELIVERY_RETENTION_INTERVAL_MS: ${DELIVERY_RETENTION_INTERVAL_MS:-300000}
      DELIVERY_RETENTION_BATCH_SIZE: ${DELIVERY_RETENTION_BATCH_SIZE:-1000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: real-estate-intelligence-worker
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:fs').accessSync('/tmp/real-estate-intelligence-worker-ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  # Owner-operated one-shot surface. It is excluded from ordinary `compose up` and never starts
  # collection implicitly with the long-lived worker.
  collection-command:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    entrypoint: ['node', '-r', './dist/otel.js', 'dist/collection/collect-synthetic.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-realestate}@postgres:5432/${POSTGRES_DB:-real_estate_intelligence}
      WORKER_OPERATION_TIMEOUT_MS: ${WORKER_OPERATION_TIMEOUT_MS:-5000}
      COLLECTION_DEADLINE_MS: ${COLLECTION_DEADLINE_MS:-30000}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-real-estate-snapshots}
      OBJECT_STORE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-realestate}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-realestate}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: real-estate-intelligence-collection-command
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: 'no'

  # Explicit owner-operated resumable fixture command. It has no scheduler or collection consumer.
  resumable-collection-command:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    entrypoint: ['node', '-r', './dist/otel.js', 'dist/collection/collect-resumable.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-realestate}@postgres:5432/${POSTGRES_DB:-real_estate_intelligence}
      WORKER_OPERATION_TIMEOUT_MS: ${WORKER_OPERATION_TIMEOUT_MS:-5000}
      COLLECTION_DEADLINE_MS: ${COLLECTION_DEADLINE_MS:-30000}
      SYNTHETIC_PAGE_DELAY_MS: ${SYNTHETIC_PAGE_DELAY_MS:-0}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-real-estate-snapshots}
      OBJECT_STORE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-realestate}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-realestate}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: real-estate-intelligence-resumable-collection-command
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: 'no'

  # Database-only operator surface for enabling an already reviewed register entry.
  source-enable:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    entrypoint: ['node', '-r', './dist/otel.js', 'dist/collection/enable-source.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD:-realestate}@postgres:5432/${POSTGRES_DB:-real_estate_intelligence}
      WORKER_OPERATION_TIMEOUT_MS: ${WORKER_OPERATION_TIMEOUT_MS:-5000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: real-estate-intelligence-source-enable
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: 'no'

  # Deliberately without DATABASE_URL and without object storage credentials:
  # the LangGraph service reaches domain capabilities only through typed tools
  # that call the API's versioned HTTP contract.
  ai:
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_BASE_URL: http://api:8200
    ports:
      - '${AI_PORT:-4111}:4111'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4111/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-3200}:3200'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3200/']
      interval: 5s
      timeout: 3s
      retries: 12

  # Valkey remains optional and has no consumer in the MVP.
  valkey:
    image: valkey/valkey:9-alpine
    profiles: [optional]
    ports:
      - '${VALKEY_PORT:-6380}:6379'
    volumes:
      - valkey-data:/data

volumes:
  postgres-data:
  rabbitmq-data:
  valkey-data:
  minio-data:
