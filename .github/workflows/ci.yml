name: CI

on:
  push:
    branches: [main, feat/phase-1]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  HADOLINT_VERSION: 2.14.0
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.22.0

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pinned binary is used instead of the marketplace action so that CI
      # and the Dev Container run the exact same gitleaks version.
      - name: Install gitleaks
        run: |
          set -Eeuo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${base}/${archive}" -o "${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history
        run: gitleaks git --redact --no-banner

  format:
    name: Formatting and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm run format:check

      - name: Markdownlint
        run: pnpm run lint:md

      - name: Hadolint
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o hadolint
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          hadolint docker/*.Dockerfile

  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run build

  integration-plan:
    name: Plan integration shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request is checked out as its merge commit; the first parent is the base.
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # integration/shards.ts is the single shard plan; the matrix is never repeated here.
      # Only a pull request that changes nothing but prose skips the campaigns: no campaign reads
      # Markdown, product specifications or ADRs. A push to a release branch always runs them,
      # because `publish` must never follow campaigns that did not run.
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          printf 'matrix=%s\n' "$(node scripts/integration-shards.mjs matrix)" >> "$GITHUB_OUTPUT"
          run=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [[ -n "$changed" ]] && ! grep -qvE '\.md$|^_bmad-output/|^specs/' <<< "$changed"; then
              run=false
            fi
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"

  # The serial suite needs hours on a hosted runner, so every campaign runs in exactly one shard
  # (proved by integration/support/shards.test.ts). `integration-gate` needs all of them.
  integration:
    name: Owned real-service Vitest integration (${{ matrix.shard }})
    needs: integration-plan
    if: needs.integration-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The three preparations are independent, so they share the runner's four cores instead of
      # queueing: the image builds read no host build output (.dockerignore excludes dist).
      - name: Build the workspaces, this shard's fixture images and sandboxed Chromium together
        env:
          IMAGE_PROFILE: ${{ matrix.images }}
        run: |
          set -Eeuo pipefail
          logs="$RUNNER_TEMP/prepare"
          mkdir -p "$logs"
          track() {
            local name=$1 started=$SECONDS
            shift
            "$@" > "$logs/$name.log" 2>&1
            printf '%s finished in %s s\n' "$name" "$((SECONDS - started))" >> "$logs/$name.log"
          }
          declare -A pid
          track chromium pnpm exec playwright install --with-deps chromium &
          pid[chromium]=$!
          track images bash scripts/prepare-integration-images.sh "$IMAGE_PROFILE" &
          pid[images]=$!
          track workspaces pnpm run build &
          pid[workspaces]=$!
          failed=0
          for name in chromium images workspaces; do
            wait "${pid[$name]}" || failed=1
            echo "::group::$name"
            cat "$logs/$name.log"
            echo "::endgroup::"
          done
          if [[ "$failed" != 0 ]]; then
            echo 'A preparation failed; see its group above.' >&2
            exit 1
          fi
          sandbox=$(node --input-type=module -e 'import { chromium } from "playwright"; import { dirname, join } from "node:path"; process.stdout.write(join(dirname(chromium.executablePath()), "chrome_sandbox"));')
          sudo install -o root -g root -m 4755 "$sandbox" "$RUNNER_TEMP/chrome-devel-sandbox"
          printf 'CHROME_DEVEL_SANDBOX=%s/chrome-devel-sandbox\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prove this shard's integration campaigns
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm run test:integration:shard "$SHARD"
      - name: Prove fixture cleanup
        if: always()
        run: |
          set -Eeuo pipefail
          leftover=$(
            docker ps --all --format 'container {{.Names}}'
            docker volume ls --format 'volume {{.Name}}'
            docker network ls --format 'network {{.Name}}'
          )
          if grep -E '^(container|volume|network) rei-' <<< "$leftover"; then
            echo 'Owned rei- fixture resources survived their campaigns.' >&2
            exit 1
          fi

  # One required result for the whole matrix. A skipped matrix passes only when the plan itself
  # decided that a prose-only pull request needs no campaign; otherwise every shard must succeed.
  integration-gate:
    name: Integration gate
    if: always()
    needs: [integration-plan, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.integration-plan.result }}
          RUN: ${{ needs.integration-plan.outputs.run }}
          SHARDS: ${{ needs.integration.result }}
        run: |
          set -Eeuo pipefail
          echo "plan=$PLAN run=$RUN shards=$SHARDS"
          [[ "$PLAN" == success ]]
          if [[ "$RUN" == false ]]; then
            [[ "$SHARDS" == skipped ]]
          else
            [[ "$SHARDS" == success ]]
          fi

  containers:
    name: Build application images (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build all five images together for the checked-out commit
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          images=(migrate api worker ai web)
          pids=()
          for image in "${images[@]}"; do
            docker buildx build --load --file "docker/${image}.Dockerfile" \
              --build-arg VITE_PUBLIC_BASE=/real-estate-intelligence/ \
              --label "org.opencontainers.image.revision=${REVISION}" \
              --tag "rei-${image}:${REVISION}" . > "$RUNNER_TEMP/${image}.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for index in "${!images[@]}"; do
            wait "${pids[$index]}" || failed=1
            echo "::group::${images[$index]}"
            cat "$RUNNER_TEMP/${images[$index]}.log"
            echo "::endgroup::"
          done
          [[ "$failed" == 0 ]]

  publish:
    name: Publish gated release images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/phase-1')
    needs: [secrets, format, workspace, integration-gate, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish five revision-labelled images serially and retain manifest digests
        env:
          REVISION: ${{ github.sha }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          VITE_PRIVACY_CONTROLLER_NAME: ${{ vars.VITE_PRIVACY_CONTROLLER_NAME }}
          VITE_PRIVACY_CONTACT_EMAIL: ${{ vars.VITE_PRIVACY_CONTACT_EMAIL }}
        run: |
          set -Eeuo pipefail
          mkdir -p release
          for image in migrate api worker ai web; do
            docker buildx build --push --file "docker/${image}.Dockerfile" \
              --build-arg VITE_PUBLIC_BASE=/real-estate-intelligence/ \
              --build-arg "VITE_PRIVACY_CONTROLLER_NAME=${VITE_PRIVACY_CONTROLLER_NAME}" \
              --build-arg "VITE_PRIVACY_CONTACT_EMAIL=${VITE_PRIVACY_CONTACT_EMAIL}" \
              --label "org.opencontainers.image.revision=${REVISION}" \
              --metadata-file "release/${image}.json" \
              --tag "${IMAGE_REPOSITORY}/${image}:${REVISION}" .
            digest=$(jq -er '.["containerimage.digest"]' "release/${image}.json")
            printf '%s %s/%s@%s\n' "$REVISION" "$IMAGE_REPOSITORY" "$image" "$digest" >> release/images.txt
          done
          cat release/images.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
