# The epics of the initiative, in build order. `id` names an epic for good; the order of the tables is the order.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "Platform baseline"
covers = []

[[epic]]
id = 2
slug = "epic-collection"
title = "Collection of listings with raw snapshots"
covers = ["CAP-1", "CAP-2", "CAP-4", "CAP-28"]
after = [
  { epic = 1, needs = "the outbox and relay, the resilience composition, the kernel and the data-handling ADR" },
]

[[epic]]
id = 3
slug = "epic-properties"
title = "Properties, listings and their history"
covers = ["CAP-3", "CAP-4", "CAP-5", "CAP-6", "CAP-7", "CAP-8", "CAP-28"]
after = [
  { epic = 1, needs = "the outbox, the kernel and the contract conventions" },
  { epic = 2, needs = "the `collection.snapshot.parsed`, `collection.run.completed` and `collection.listing.suppressed` contracts, the fingerprints in the parsed payload and the facade for source permissions, run and snapshot hash" },
]

[[epic]]
id = 4
slug = "epic-market"
title = "Deterministic place figures"
covers = ["CAP-9", "CAP-28"]
after = [
  { epic = 1, needs = "the outbox, the kernel and the contract conventions" },
  { epic = 2, needs = "the `collection.listing.suppressed` event contract" },
  { epic = 3, needs = "the `properties.listing.*` and `properties.property.*` event contracts and the `locations` facade" },
]

[[epic]]
id = 5
slug = "epic-ask"
title = "Natural-language runs"
covers = ["CAP-10", "CAP-11", "CAP-12", "CAP-13", "CAP-14", "CAP-15", "CAP-16", "CAP-17", "CAP-18"]
after = [
  { epic = 1, needs = "NestJS 12 without Mastra, the outbox and relay, the resilience composition and the Zero Data Retention ADR" },
]

[[epic]]
id = 6
slug = "epic-web"
title = "Place-first web application"
covers = ["CAP-19", "CAP-20", "CAP-28"]
after = [
  { epic = 1, needs = "the contract conventions and the deployed stack" },
  { epic = 2, needs = "the list of sources for the privacy notice" },
  { epic = 3, needs = "the search, property, listing and largest-reductions shapes" },
  { epic = 4, needs = "the place-figure, neighbours and series shapes" },
  { epic = 5, needs = "the run and SSE shapes" },
]

[[epic]]
id = 7
slug = "epic-authentication-and-operations"
title = "Sign-in and protected operations"
covers = ["CAP-32", "CAP-26", "CAP-27"]
after = [
  { epic = 2, needs = "collection runs, the source register and the operator commands" },
  { epic = 3, needs = "matches awaiting review" },
  { epic = 5, needs = "run and provider figures" },
  { epic = 6, needs = "the shell" },
]

[[epic]]
id = 8
slug = "epic-comparables"
title = "Auditable comparables"
covers = ["CAP-21"]
after = [
  { epic = 3, needs = "the candidates facade of `properties`" },
  { epic = 6, needs = "the shell" },
]

[[epic]]
id = 9
slug = "epic-alerts"
title = "Alert rules and inbox"
covers = ["CAP-23"]
after = [
  { epic = 7, needs = "a signed-in user" },
  { epic = 8, needs = "the comparables median used by the below-market alert" },
  { epic = 3, needs = "listing events" },
]

[[epic]]
id = 10
slug = "epic-market-analytics"
title = "Market movement and recorded sale figures"
covers = ["CAP-22", "CAP-33"]
after = [
  { epic = 4, needs = "price facts and the monthly series" },
  { epic = 6, needs = "the shell" },
]

[[epic]]
id = 11
slug = "epic-map"
title = "Map with the block layer"
covers = ["CAP-24"]
after = [
  { epic = 3, needs = "the filtered properties" },
  { epic = 4, needs = "the price per m² per block" },
  { epic = 6, needs = "the shell" },
]

[[epic]]
id = 12
slug = "epic-expanded-intents"
title = "Remaining natural-language intents"
covers = ["CAP-25"]
after = [
  { epic = 5, needs = "the run pipeline" },
  { epic = 3, needs = "search and property history" },
  { epic = 4, needs = "region statistics" },
  { epic = 8, needs = "comparables" },
]

[[epic]]
id = 13
slug = "epic-interpreted-listings"
title = "Model-interpreted attributes and model-assisted matching"
covers = ["CAP-30", "CAP-31"]
after = [
  { epic = 3, needs = "listings and entity resolution" },
  { epic = 5, needs = "the AI service" },
]

[[epic]]
id = 14
slug = "epic-dark-theme"
title = "Dark theme"
covers = ["CAP-29"]
after = [
  { epic = 6, needs = "every screen and the shell" },
]
