# The planned stories of this epic, in build order. `id` names an entry for good; the order of the tables is the order.

[[entry]]
id = 1
type = "story"
title = "ADR for routing and data fetching in the web application"
description = "Records as an ADR the router and the data-fetching approach of `apps/web`, which ADR 0006 left out of the foundation phase (CAP-19). The record also names the internationalization and component-test approach."
verify = "The ADR is accepted by the owner under `specs/adrs/`."
covers = ["CAP-19"]
after = []
hitl = true
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Place overview with one figure from the contract"
description = "Proves the path: the Placa shell with the place plate and the median asking price per m² of a neighborhood read from `/api/v1`, at 390 px and from 960 px up, in both locales (CAP-19)."
verify = "Opening a neighborhood on the Compose stack shows its plate and its median with the provenance line in Portuguese and in English."
covers = ["CAP-19"]
after = [1, "1.7", "4.1"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Shell, navigation and conventions"
description = "Completes the shell: tab bar and rail, crumbs, language switch, footer, self-hosted Barlow fonts and locale formatting of numbers and dates, and sets the route table, the locale catalogue per screen and the API client that every screen entry extends (CAP-19)."
verify = "Places, Search and Ask are reachable on both widths, Alerts and Operations are absent, and no request leaves for a font host."
covers = ["CAP-19"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 15
type = "story"
title = "Shared components and the accessibility harness"
description = "Builds the components more than one screen uses, with the styles of `components.css`: the property row and the figure with its provenance; adds the automated accessibility harness and the contrast check of the tokens that every screen entry runs (CAP-19, CAP-20)."
verify = "The component tests pass, and the harness and the contrast check pass on the shell and on each shared component."
covers = ["CAP-19", "CAP-20"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "System states"
description = "Builds loading, no results, could not load and stale figures as shared states every screen uses (CAP-19)."
verify = "Each state renders from a forced condition on both widths and both locales."
covers = ["CAP-19"]
after = [15]
hitl = false
risk = "low"

