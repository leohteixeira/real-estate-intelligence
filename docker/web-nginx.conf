server {
    listen 3200;
    server_name _;

    root /srv/rei;
    index index.html;

    location = __PUBLIC_BASE__ {
        return 308 https://leohteixeira.com/en/projects/real-estate-intelligence;
    }

    location = __PUBLIC_BASE__ready {
        proxy_pass http://api:8200/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location __PUBLIC_BASE__api/v1/ {
        proxy_pass http://api:8200/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Assets and direct/deep routes retain the same build-time public base.
    location __PUBLIC_BASE__ {
        try_files $uri $uri/ __PUBLIC_BASE__index.html;
    }
}
