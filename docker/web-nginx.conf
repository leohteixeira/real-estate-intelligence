server {
    listen 3200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 308 https://leohteixeira.com/en/projects/real-estate-intelligence;
    }

    location = /ready {
        proxy_pass http://api:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/ {
        proxy_pass http://api:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single page application: unknown paths fall back to the entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
