packages:
  - apps/*
  - packages/*

# pnpm blocks dependency build scripts by default. These two are approved
# explicitly:
#   esbuild     downloads its own platform binary, needed by Vite
#   protobufjs  regenerates its bundled helpers, pulled in by the OTLP exporters
allowBuilds:
  esbuild: true
  protobufjs: true

# pnpm gates very recently published versions; these two are pinned on purpose.
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.0'
  - vite@8.2.2
